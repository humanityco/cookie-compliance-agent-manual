name: Repo checks

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cookbooks must match skills/*/references
        run: bash scripts/sync-references.sh --check
      - name: site/ must match skills, cookbooks and root docs
        run: bash scripts/sync-site.sh --check

  no-real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No real AppIDs or customer domains
        run: bash scripts/check-no-real-data.sh
      - name: No internal identifiers (decision IDs, tickets, hosts, repos, DB names)
        run: bash scripts/check-no-internal.sh
